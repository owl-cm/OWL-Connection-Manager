name: Build and Release

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pages: write
  id-token: write

env:
  RELEASE_TAG: v2.0.0
  RELEASE_VERSION: '2.0.0'

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm install

      - name: Set package version
        run: npm version ${{ env.RELEASE_VERSION }} --no-git-tag-version

      - name: Build .deb package
        run: npm run build:deb
        env:
          APP_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: develop
          files: dist/installers/*.deb
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && github.event.pull_request.merged == true
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
